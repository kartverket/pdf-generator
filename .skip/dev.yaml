apiVersion: skiperator.kartverket.no/v1alpha1
kind: Application

metadata:
  name: gotenberg
  namespace: matrikkel-main
spec:
  image: "{{ image }}"
  port: 8089
  ingresses:
    - gotenberg.atkv3-dev.kartverket-intern.cloud
  replicas: 1

  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 512Mi

  liveness:
    port: 8089
    path: /health
    initialDelay: 10 # default: 0
    failureThreshold: 6 # default: 3
  readiness:
    port: 8089
    path: /health
    initialDelay: 10 # default: 0
    failureThreshold: 6 # default: 3
